<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Favicon -->
    <link rel="icon" type="image/png" href="assets/favicon.png">
    <!-- Internal Styling -->
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #1e1e1e 0%, #2d2d2d 100%);
            color: #e0e0e0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            background: #000;
            padding: 40px 20px;
            text-align: center;
            border-bottom: 4px solid #f4a261;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
        }

        header::before {
            content: '';
            display: block;
            width: 80px;
            height: 4px;
            background: #f4a261;
            margin: 0 auto 20px;
        }

        h1 {
            font-size: 2.5rem;
            font-weight: 300;
            letter-spacing: 3px;
            text-transform: uppercase;
            color: #fff;
        }

        main {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 60px 20px;
        }

        section {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            padding: 60px;
            border-radius: 2px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.1);
            text-align: center;
            max-width: 500px;
            width: 100%;
        }

        section::before {
            content: '';
            display: block;
            width: 60px;
            height: 60px;
            background: #f4a261;
            margin: 0 auto 30px;
            clip-path: polygon(50% 0%, 100% 50%, 50% 100%, 0% 50%);
        }

        form {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        input[type="submit"] {
            background: #f4a261;
            color: #000;
            border: none;
            padding: 18px 40px;
            font-size: 1rem;
            font-weight: 600;
            letter-spacing: 2px;
            text-transform: uppercase;
            cursor: pointer;
            transition: all 0.3s ease;
            border-radius: 2px;
            box-shadow: 0 4px 15px rgba(244, 162, 97, 0.3);
        }

        input[type="submit"]:hover {
            background: #e76f51;
            transform: translateY(-2px);
            box-shadow: 0 6px 25px rgba(244, 162, 97, 0.5);
        }

        input[type="submit"]:active {
            transform: translateY(0);
            box-shadow: 0 2px 10px rgba(244, 162, 97, 0.3);
        }

        footer {
            background: #000;
            padding: 30px 20px;
            text-align: center;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
        }

        footer h4 {
            font-size: 0.9rem;
            font-weight: 300;
            letter-spacing: 1px;
            color: #999;
        }

        /* Media query */
        @media (max-width: 768px) {
            header h1 {
                font-size: 1.8rem;
            }

            section {
                padding: 40px 30px;
            }

            input[type="submit"] {
                padding: 15px 30px;
            }
        }
    </style>
    <title>PHP Final Project - Problem #1</title>
</head>
<body>
    <header>
        <h1>PHP Final Project - MySQL Inner Join Query</h1>
    </header>
    <main>
        <section>
            <form action="backend/innerJoin.php" method="POST">
                <input type="submit" name="submit" value="View Course Completions">
            </form>
        </section>
    </main>
    <footer>
        <h4>Site Authored by Eric Henderson &copy; 2025</h4>
    </footer>
</body>
</html>
